[project]
name = "bookkeeper"
version = "0.1.0"
description = "MCP server for semantic search over personal and repo documentation"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "rank-bm25>=0.2",
    "hnswlib>=0.8",
]

[project.optional-dependencies]
code = ["treesitter-chunker>=0.4"]
test = ["pytest>=8.0"]
all = ["treesitter-chunker>=0.4"]

[project.scripts]
bookkeeper = "agents_rag.server:main"
bookkeeper-web = "agents_rag.web:main"
agents-rag = "agents_rag.server:main"
agents-rag-web = "agents_rag.web:main"

[tool.setuptools.packages.find]
include = ["agents_rag*"]
exclude = ["eval*", "tests*", "docs*"]

[tool.setuptools.package-data]
agents_rag = ["static/*.html"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
