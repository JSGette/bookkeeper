[project]
name = "agents-rag"
version = "0.1.0"
description = "MCP server for semantic search over personal and repo documentation"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
code = ["treesitter-chunker>=0.4"]
perf = ["hnswlib>=0.8"]
all = ["treesitter-chunker>=0.4", "hnswlib>=0.8"]

[project.scripts]
agents-rag = "agents_rag.server:main"
agents-rag-web = "agents_rag.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
